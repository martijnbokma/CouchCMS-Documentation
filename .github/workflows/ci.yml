# Validates MDX and builds the Astro + Starlight site on every push and PR.
name: CI

on:
    push:
        branches:
            - main
            - master
            - docs-v2
            - gh-pages
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate-and-build:
        name: Validate and build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Validate documentation
              run: bun run validate

            - name: Build site
              run: bun run build
